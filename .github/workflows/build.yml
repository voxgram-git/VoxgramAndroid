name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "What to build"
        type: choice
        default: release
        options:
          - release
          - standalone
          - debug
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.variant || 'release' }}
  cancel-in-progress: true

env:
  NDK_VERSION: "21.4.7075529"
  CMAKE_VERSION: "3.10.2.4988404"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          # other NDK versions preinstalled on the runner are not used
          sudo rm -rf "$ANDROID_HOME/ndk"/*
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pick Gradle task
        id: task
        run: |
          case "${{ inputs.variant || 'release' }}" in
            release)    echo "task=:TMessagesProj_App:assembleAfatRelease" >> "$GITHUB_OUTPUT" ;;
            standalone) echo "task=:TMessagesProj_AppStandalone:assembleAfatStandalone" >> "$GITHUB_OUTPUT" ;;
            debug)      echo "task=:TMessagesProj_App:assembleAfatDebug" >> "$GITHUB_OUTPUT" ;;
          esac

      # Optional: sign with your own key. Add these repository secrets:
      #   KEYSTORE_BASE64   - base64 of the .keystore/.jks file (base64 -w0 release.keystore)
      #   KEYSTORE_PASSWORD - store password
      #   KEY_ALIAS         - key alias
      #   KEY_PASSWORD      - key password
      # Without them the build is signed with the test key from TMessagesProj/config.
      - name: Use release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set, signing with the test key from the repository"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          echo "CUSTOM_SIGNING=1" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          args=()
          if [ "$CUSTOM_SIGNING" = "1" ]; then
            args+=("-PRELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" "-PRELEASE_KEY_ALIAS=$KEY_ALIAS" "-PRELEASE_KEY_PASSWORD=$KEY_PASSWORD")
          fi
          ./gradlew ${{ steps.task.outputs.task }} "${args[@]}" --stacktrace

      - name: Collect APK
        id: apk
        run: |
          variant="${{ inputs.variant || 'release' }}"
          version=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          apk=$(find TMessagesProj_App* -name '*.apk' -path '*afat*' -not -path '*/intermediates/*' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          name="Voxgram-${version}-${variant}.apk"
          cp "$apk" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.apk.outputs.name }}
